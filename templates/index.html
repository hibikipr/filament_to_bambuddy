<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ t('app.title') }}</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#00ae42">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filament">
<meta name="application-name" content="Filament">
<style>html{background:#1a1a1a}</style>
<style>
  :root{
    --bg:#1a1a1a; --card:#2d2d2d; --tertiary:#3d3d3d; --green:#00ae42;
    --green-light:#00c64d; --fg:#e8e8e8; --muted:#a0a0a0; --danger:#e0533d;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
  #ptr{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);
    font-size:13px;background:var(--bg);transform:translateY(-100%);z-index:30;pointer-events:none}
  #ptrIcon{font-size:18px;display:inline-block;transition:transform .15s}
  @keyframes ptrspin{to{transform:rotate(360deg)}}
  header{padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid #333;position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:18px;margin:0;font-weight:600}
  .cube{width:26px;height:26px;flex:0 0 auto}
  main{padding:16px;max-width:560px;margin:0 auto;
    padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .muted{color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,button,textarea{font-size:16px;font-family:inherit}
  input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #4a4a4a;
    background:#1f1f1f;color:var(--fg)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  button{cursor:pointer;border:none;border-radius:10px;padding:13px 16px;font-weight:600}
  .btn-primary{background:var(--green);color:#0a0a0a;width:100%}
  .btn-primary:disabled{background:#066b2c;color:#5a5a5a}
  .btn-secondary{background:var(--tertiary);color:var(--fg);width:100%}
  #video{width:100%;border-radius:var(--radius);background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
  #videoWrap{position:relative;border-radius:var(--radius);overflow:hidden}
  .hidden{display:none}
  /* Scan viewfinder: guide box + corner brackets + sweeping scan line, so
     it's obvious where to line up the barcode (or QR code). */
  .viewfinder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .vf-box{position:relative;width:82%;max-width:320px;height:38%}
  .vf-box::before{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
  .vf-corner{position:absolute;width:24px;height:24px;border:3px solid var(--green)}
  .vf-corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none;border-top-left-radius:8px}
  .vf-corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none;border-top-right-radius:8px}
  .vf-corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none;border-bottom-left-radius:8px}
  .vf-corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none;border-bottom-right-radius:8px}
  .vf-scanline{position:absolute;left:0;right:0;height:2px;background:var(--green);
    box-shadow:0 0 6px 2px rgba(0,174,66,.6);animation:vfscan 2s ease-in-out infinite}
  @keyframes vfscan{0%,100%{top:6%}50%{top:94%}}
  @media (prefers-reduced-motion: reduce){.vf-scanline{animation:none;top:50%}}
  .badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;
    background:var(--tertiary);color:var(--muted);margin-left:6px;vertical-align:middle}
  .badge.cache{background:#0c4a2a;color:var(--green-light)}
  .badge.upc{background:#0b3a66;color:#9cd2ff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    padding:12px 18px;border-radius:10px;font-weight:600;max-width:90%;text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:20}
  .toast.ok{background:var(--green);color:#0a0a0a}
  .toast.err{background:var(--danger);color:#fff}
  .swatch{height:44px;border-radius:9px;border:1px solid #4a4a4a;width:100%;padding:0}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hint.err{color:var(--danger)}
  .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>
<div id="ptr"><span id="ptrIcon">↓</span><span id="ptrText">{{ t('ptr.pull') }}</span></div>
<header>
  <svg class="cube" viewBox="0 0 64 64" aria-hidden="true">
    <polygon points="32,8 8,22 32,36 56,22" fill="#00c64d"/>
    <polygon points="8,22 8,46 32,60 32,36" fill="#00ae42"/>
    <polygon points="56,22 56,46 32,60 32,36" fill="#009438"/>
  </svg>
  <h1>{{ t('app.title') }}</h1>
</header>

<main>
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="muted" style="flex:1"><span id="dot" class="status-dot" style="background:#888"></span><span id="health">{{ t('health.checking') }}</span></div>
      <button id="refreshDb" class="btn-secondary" style="flex:0 0 auto;width:auto;padding:8px 12px;font-size:13px">{{ t('scan.refresh_db') }}</button>
    </div>
    <div id="refreshHint" class="hint"></div>
    <div style="margin-top:6px"><a id="clearCache" href="#" style="color:var(--muted);font-size:12px">{{ t('scan.clear_cache') }}</a></div>
  </div>

  <!-- Scan -->
  <div class="card">
    <button id="startBtn" class="btn-secondary">{{ t('scan.scan_button') }}</button>
    <div id="videoWrap" class="hidden">
      <video id="video" playsinline></video>
      <div class="viewfinder">
        <div class="vf-box">
          <span class="vf-corner tl"></span>
          <span class="vf-corner tr"></span>
          <span class="vf-corner bl"></span>
          <span class="vf-corner br"></span>
          <div class="vf-scanline"></div>
        </div>
      </div>
    </div>
    <button id="stopBtn" class="btn-secondary hidden" style="margin-top:10px">{{ t('scan.stop_camera') }}</button>
    <label for="manual" style="margin-top:14px">{{ t('scan.manual_label') }}</label>
    <div class="row">
      <div><input id="manual" placeholder="{{ t('scan.manual_placeholder') }}"></div>
      <div style="flex:0 0 96px"><button id="lookupBtn" class="btn-secondary">{{ t('scan.lookup_button') }}</button></div>
    </div>
    <div id="scanHint" class="hint"></div>

    <div style="text-align:center;color:var(--muted);font-size:12px;margin:12px 0 8px">{{ t('scan.or_separator') }}</div>
    <button id="ocrBtn" class="btn-secondary">{{ t('scan.ocr_button') }}</button>
    <input id="labelPhoto" type="file" accept="image/*" capture="environment" class="hidden">
    <div id="ocrHint" class="hint"></div>
  </div>

  <!-- Details form -->
  <form id="form" class="card hidden">
    <div style="font-weight:600;margin-bottom:4px">
      {{ t('form.title') }} <span id="srcBadge" class="badge"></span>
      <a id="forgetBtn" href="#" class="hidden" style="float:right;font-size:12px;color:var(--muted)">{{ t('form.forget') }}</a>
    </div>
    <div id="barcodeLine" class="muted" style="margin-bottom:2px"></div>
    <div id="titleLine" class="muted" style="margin-bottom:2px"></div>
    <div id="linkedCodesLine" class="muted" style="margin-bottom:8px;font-size:12px"></div>

    <label>{{ t('form.paste_title_label') }}</label>
    <div class="row">
      <div><input id="paste_title" placeholder="{{ t('form.paste_title_placeholder') }}"></div>
      <div style="flex:0 0 96px"><button id="autofillBtn" type="button" class="btn-secondary">{{ t('form.fill_button') }}</button></div>
    </div>
    <div class="hint" style="margin-bottom:6px">
      {{ t('form.fill_hint') }}
      <a id="searchLink" href="#" target="_blank" rel="noopener"
         style="color:var(--green-light)">{{ t('form.search_link') }}</a>
    </div>

    <label>{{ t('form.material') }}</label>
    <select id="material" required></select>

    <div class="row">
      <div><label>{{ t('form.brand') }}</label><input id="brand" list="brandList" autocomplete="off"></div>
      <div><label>{{ t('form.subtype') }}</label><select id="subtype"></select></div>
    </div>
    <datalist id="brandList"></datalist>

    <div class="row">
      <div><label>{{ t('form.color_name') }}</label><input id="color_name" list="colorList" autocomplete="off"></div>
      <div><label>{{ t('form.color') }}</label><input id="color_picker" type="color" class="swatch" value="#00ae42"></div>
    </div>
    <datalist id="colorList"></datalist>

    <div class="row">
      <div><label>{{ t('form.net_weight') }}</label><select id="label_weight"></select></div>
      <div><label>{{ t('form.quantity') }}</label><input id="quantity" inputmode="numeric" value="1"></div>
    </div>

    <div class="row">
      <div><label>{{ t('form.storage_location') }}</label><select id="storage_location"></select></div>
      <div><label>{{ t('form.category') }}</label><input id="category" placeholder="{{ t('form.optional_placeholder') }}"></div>
    </div>

    <div class="row">
      <div><label>{{ t('form.nozzle_min') }}</label><input id="nozzle_temp_min" inputmode="numeric"></div>
      <div><label>{{ t('form.nozzle_max') }}</label><input id="nozzle_temp_max" inputmode="numeric"></div>
      <div><label>{{ t('form.cost_per_kg') }}</label><input id="cost_per_kg" inputmode="decimal"></div>
    </div>

    <label>{{ t('form.note') }}</label>
    <textarea id="note" rows="2" placeholder="{{ t('form.optional_placeholder') }}"></textarea>

    <button id="submitBtn" type="submit" class="btn-primary" style="margin-top:16px">{{ t('form.submit') }}</button>
  </form>
</main>

<footer style="max-width:560px;margin:0 auto;text-align:center;color:var(--muted);font-size:11px;padding:0 16px calc(16px + env(safe-area-inset-bottom))">
  {{ t('app.title') }} {{ version }}
</footer>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
// Active-language translation dict, embedded server-side (see app.py's
// index() route) so the in-browser JS doesn't need a second round trip or
// its own copy of the strings. Mirrors the Python i18n.get_translation()
// lookup: dot-separated key path, "{name}"-style interpolation, with an
// _plural-suffixed key for the count!=1 case (same convention Bambuddy's
// frontend i18next config uses).
const I18N_LANG = {{ lang|tojson }};
const I18N = {{ translations|tojson }};
function t(key, vars){
  const parts = key.split('.');
  let v = I18N;
  for(const p of parts){ v = (v && typeof v==='object') ? v[p] : undefined; }
  if(typeof v !== 'string') return key;
  if(vars) for(const k in vars) v = v.split('{'+k+'}').join(String(vars[k]));
  return v;
}
// Picks the singular or `${key}_plural` form based on `count`, then
// interpolates {count} (and any other vars) into it.
function tn(key, count, vars){
  const k = count === 1 ? key : key+'_plural';
  return t(k, Object.assign({count}, vars));
}

const $ = id => document.getElementById(id);
let reader = null, currentBarcode = null;

// Register the service worker (enables installable PWA). Needs https or localhost.
if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ── Pull-to-refresh (custom, for standalone PWA where native is disabled) ──
(function(){
  const ptr=$('ptr'), icon=$('ptrIcon'), txt=$('ptrText');
  const TRIGGER=90;            // pull distance (px) to trigger a refresh
  let startY=0, pull=0, active=false;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;

  window.addEventListener('touchstart', e => {
    if(e.touches.length===1 && atTop()){ startY=e.touches[0].clientY; active=true; ptr.style.transition='none'; }
  }, {passive:true});

  window.addEventListener('touchmove', e => {
    if(!active) return;
    pull = e.touches[0].clientY - startY;
    if(pull>0 && atTop()){
      e.preventDefault();                       // take over the gesture
      const H = ptr.offsetHeight || 56;         // includes the safe-area inset
      const off = Math.min(pull*0.55, 72);      // resistance
      ptr.style.transform = 'translateY('+(off-H)+'px)';
      const past = pull>=TRIGGER;
      icon.style.transform = past ? 'rotate(180deg)' : 'rotate(0deg)';
      txt.textContent = past ? t('ptr.release') : t('ptr.pull');
    } else { active=false; }
  }, {passive:false});

  window.addEventListener('touchend', () => {
    if(!active) return; active=false;
    ptr.style.transition='transform .25s';
    if(pull>=TRIGGER){
      ptr.style.transform='translateY(0)';
      txt.textContent=t('ptr.refreshing'); icon.textContent='↻';
      icon.style.animation='ptrspin .8s linear infinite';
      setTimeout(()=>location.reload(), 350);
    } else {
      ptr.style.transform='translateY(-100%)';
    }
    pull=0;
  });
})();

function toast(msg, ok=true){
  const el=document.createElement('div');
  el.className='toast '+(ok?'ok':'err'); el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 3500);
}

// ── Health ──
fetch('/api/health').then(r=>r.json()).then(d=>{
  if(d.ok){
    $('dot').style.background = 'var(--green)';
    $('health').textContent = t('health.connected', {bambuddy: d.bambuddy||'Bambuddy'});
  } else if(d.level === 'warn'){
    $('dot').style.background = '#e0a800';  // amber: reachable, permission issue
    $('health').innerHTML = (d.error||t('health.permission_issue'))
      + (d.bambuddy ? '<br><span style="font-size:11px">'+d.bambuddy+'</span>' : '');
  } else {
    $('dot').style.background = 'var(--danger)';
    $('health').innerHTML = t('health.not_reachable')+(d.error?': '+d.error:'')
      + (d.bambuddy ? '<br><span style="font-size:11px">'+t('health.using',{bambuddy:d.bambuddy})+'</span>' : '');
  }
}).catch(()=>{ $('health').textContent=t('health.server_error'); });

// ── Dropdown options (mirrors Bambuddy's spool form) ──
let OPTS = null;
function fillSelect(id, opts, o={}){
  const sel=$(id); sel.innerHTML='';
  if(o.blank){ const op=document.createElement('option'); op.value=''; op.textContent=o.blankText||'—'; sel.appendChild(op); }
  (opts||[]).forEach(v=>{ const op=document.createElement('option'); op.value=String(v); op.textContent=String(v); sel.appendChild(op); });
}
function fillDatalist(id, opts){
  const dl=$(id); dl.innerHTML=''; (opts||[]).forEach(v=>{ const op=document.createElement('option'); op.value=v; dl.appendChild(op); });
}
// Set a <select>, injecting the value as an option if it isn't a known one
// (lookups/OCR can produce values outside the preset list).
function setSelect(id, value){
  const sel=$(id);
  if(value==null || value===''){ sel.value=''; return; }
  value=String(value);
  if(![...sel.options].some(o=>o.value===value)){
    const op=document.createElement('option'); op.value=value; op.textContent=value;
    sel.insertBefore(op, sel.options[1] || null);
  }
  sel.value=value;
}
async function loadOptions(){
  try{ OPTS = await (await fetch('/api/options')).json(); }
  catch(e){ OPTS = {materials:[],subtypes:[],weights:[1000],colors:[],brands:[],locations:[]}; }
  fillSelect('material', OPTS.materials, {blank:true});
  fillSelect('subtype', OPTS.subtypes, {blank:true});
  fillSelect('label_weight', OPTS.weights.map(String));
  fillSelect('storage_location', OPTS.locations, {blank:true});
  fillDatalist('brandList', OPTS.brands);
  fillDatalist('colorList', OPTS.colors);
  setSelect('label_weight','1000');
}
loadOptions();

// Force-refresh the Open Filament Database + SpoolmanDB-Community.
$('refreshDb').onclick = async () => {
  $('refreshDb').disabled=true; $('refreshHint').textContent=t('scan.refreshing_db');
  try{
    const d = await (await fetch('/api/ofd/refresh',{method:'POST'})).json();
    if(d.ok){
      let msg = t('scan.refresh_updated', {barcodes:d.barcodes, brands:d.brands});
      if(d.spoolmandb_community_barcodes!=null) msg += t('scan.refresh_updated_smdb', {count:d.spoolmandb_community_barcodes});
      $('refreshHint').textContent = msg;
      await loadOptions();
    }
    else { $('refreshHint').textContent=t('scan.refresh_failed')+(d.error?': '+d.error:''); }
  }catch(e){ $('refreshHint').textContent=t('scan.refresh_failed'); }
  finally{ $('refreshDb').disabled=false; }
};

// Clear ALL remembered lookups.
$('clearCache').onclick = async (e) => {
  e.preventDefault();
  if(!confirm(t('scan.clear_confirm'))) return;
  try{
    const d = await (await fetch('/api/cache', {method:'DELETE'})).json();
    toast(tn('scan.cleared', d.cleared||0));
  }catch(e){ toast(t('scan.clear_failed'), false); }
};

// Forget just the current barcode.
$('forgetBtn').onclick = async (e) => {
  e.preventDefault();
  if(!currentBarcode) return;
  try{
    await fetch('/api/cache/'+encodeURIComponent(currentBarcode), {method:'DELETE'});
    toast(t('form.forgotten'));
    $('forgetBtn').classList.add('hidden');
    $('srcBadge').className='badge'; $('srcBadge').textContent=t('form.manual_entry');
  }catch(e){ toast(t('form.forget_failed'), false); }
};

// ── Barcode validation (UPC/EAN/GTIN + GS1 Digital Link QR) ──
// Standard GS1 check-digit lengths for retail barcodes: EAN-8, UPC-A/EAN-12,
// EAN-13, and GTIN-14. A camera misread (e.g. a false-positive decode from
// video noise) tends to produce something far shorter — a single digit is
// the most common symptom — so gating on both length and checksum rejects
// that before it ever reaches the lookup API.
function isValidUpcEanBarcode(value){
  if(!/^\d+$/.test(value)) return false;
  if(![8,12,13,14].includes(value.length)) return false;
  const checkDigit = Number(value[value.length-1]);
  let sum = 0, weight = 3;
  for(let i=value.length-2;i>=0;i--){ sum += Number(value[i])*weight; weight = weight===3?1:3; }
  return ((10-(sum%10))%10) === checkDigit;
}
// GS1 Digital Link QR codes encode the GTIN as the "01" application
// identifier in the URL path, e.g. "https://id.gs1.org/01/06938936716785"
// or with a trailing batch/lot AI. Matches with or without a scheme/host.
const GS1_DIGITAL_LINK_GTIN_RE = /(?:^|\/)01\/(\d{8,14})(?:\/|$|\?)/;
// A plain barcode decode is already a bare digit string; a QR decode is
// typically a GS1 Digital Link URL — pull the GTIN out of either shape.
// Returns a candidate only — caller still must run isValidUpcEanBarcode.
function extractGtinFromScan(text){
  const trimmed = (text||'').trim();
  if(/^\d+$/.test(trimmed)) return trimmed;
  const m = trimmed.match(GS1_DIGITAL_LINK_GTIN_RE);
  return m ? m[1] : null;
}
// Like extractGtinFromScan, but for the manual-entry field: also tolerates
// spaces/dashes typed for readability (e.g. "6938-9367-16785").
function extractGtinFromManualEntry(text){
  const trimmed = (text||'').trim();
  const m = trimmed.match(GS1_DIGITAL_LINK_GTIN_RE);
  if(m) return m[1];
  const digitsOnly = trimmed.replace(/[\s-]/g,'');
  return (digitsOnly && /^\d+$/.test(digitsOnly)) ? digitsOnly : null;
}
// Light sanity check for a manufacturer SKU/article number — e.g. a decoded
// Code 128 "inventory barcode" (no UPC/EAN counterpart, like some Polymaker
// boxes ship with) or a manually-typed SKU. Unlike a GTIN, a SKU has no
// universal checksum to validate against, so this only guards against
// obviously-wrong input (empty, or absurdly long/short) — Code 128's own
// symbology-level checksum and start/stop pattern already make a successful
// camera decode trustworthy; the backend's OFD/SpoolmanDB-Community lookups
// are the real arbiter of whether it resolves to anything.
function isPlausibleSku(value){
  const trimmed = (value||'').trim();
  return trimmed.length >= 3 && trimmed.length <= 32;
}
// Expand a decoded UPC-E code to its equivalent 12-digit UPC-A form.
//
// UPC-E is a "zero-suppressed" compression of a UPC-A code, used on small
// packaging — ZXing decodes it to its own raw 8-digit form (number-system
// digit + 6 compressed digits + check digit), which is NOT validatable via
// isValidUpcEanBarcode's standard checksum directly: that algorithm assumes
// a genuinely-encoded EAN-8 payload, not UPC-E's compression, so an 8-digit
// UPC-E read would silently fail validation and be dropped even when
// correctly decoded. It must be expanded to UPC-A first.
//
// The expansion rule is keyed on the last of the 6 compressed digits and is
// the standard GS1 zero-suppression table; the UPC-E check digit is by
// design identical to the expanded UPC-A's check digit, so no separate
// check-digit computation is needed here — isValidUpcEanBarcode verifies it
// against the expanded form. Verified against the canonical example pair
// UPC-E "01234565" <-> UPC-A "012345000065".
function expandUpcEToUpcA(upce){
  if(!/^\d{8}$/.test(upce||'')) return null;
  const [ns, d1, d2, d3, d4, d5, d6, checkDigit] = upce.split('');
  let body;
  switch(d6){
    case '0': case '1': case '2':
      body = d1+d2+d6+'0000'+d3+d4+d5; break;
    case '3':
      body = d1+d2+d3+'00000'+d4+d5; break;
    case '4':
      body = d1+d2+d3+d4+'00000'+d5; break;
    default:
      body = d1+d2+d3+d4+d5+'0000'+d6;
  }
  return ns+body+checkDigit;
}
function setScanHint(msg, isErr){
  $('scanHint').textContent = msg;
  $('scanHint').classList.toggle('err', !!isErr);
}

// ── Scanning ──
$('startBtn').onclick = async () => {
  if(!window.ZXingBrowser){ toast(t('scan.scanner_lib_failed'), false); return; }
  if(!navigator.mediaDevices || !window.isSecureContext){
    setScanHint(t('scan.camera_needs_https'), true);
    return;
  }
  try{
    reader = new ZXingBrowser.BrowserMultiFormatReader();
    // Retail filament spools carry a linear UPC/EAN barcode, a GS1 Digital
    // Link QR code encoding the same GTIN in its URL path, or — for some
    // manufacturers (e.g. a Polymaker box with no UPC/EAN at all) — a Code
    // 128 "inventory barcode" encoding a SKU/article number instead of a
    // GTIN. Restricting decode to just these formats (instead of every
    // symbology ZXing supports) cuts down on false-positive reads from
    // webcam noise, which is where the single-digit "barcode" misreads were
    // coming from.
    if(ZXingBrowser.BarcodeFormat){
      const F = ZXingBrowser.BarcodeFormat;
      // TRY_HARDER (DecodeHintType value 3 — this UMD build only exports
      // BarcodeFormat, not DecodeHintType, so the raw enum value is set
      // directly on the reader's own hints Map) trades a bit of per-frame
      // CPU for meaningfully better detection of dense/small 1D barcodes —
      // e.g. some third-party spool boxes carry an Amazon FNSKU-style Code
      // 128 label instead of a retail GTIN, and those are dense enough that
      // ZXing's default (fast) mode misses them far more often than a
      // phone's native camera scanner would.
      reader.hints.set(3, true);
      // possibleFormats' setter re-applies the whole hints map (including
      // TRY_HARDER above) to the underlying reader, so order matters here.
      reader.possibleFormats = [F.UPC_A, F.UPC_E, F.EAN_13, F.EAN_8, F.QR_CODE, F.CODE_128];
    }
    $('videoWrap').classList.remove('hidden'); $('startBtn').classList.add('hidden');
    $('stopBtn').classList.remove('hidden'); setScanHint(t('scan.align_barcode'));
    await reader.decodeFromVideoDevice(undefined, $('video'), (result, err) => {
      if(!result) return;
      if(ZXingBrowser.BarcodeFormat && result.getBarcodeFormat() === ZXingBrowser.BarcodeFormat.CODE_128){
        // Code 128 has its own symbology-level checksum and start/stop
        // pattern, so a successful decode is already trustworthy — unlike a
        // bare guessed digit string, it doesn't need a GTIN-style checksum
        // (it's typically not even a GTIN, but a manufacturer SKU/article
        // number). Only a light sanity check is applied.
        const text = (result.getText()||'').trim();
        if(!isPlausibleSku(text)) return;
        stopScan(); onBarcode(text);
        return;
      }
      if(ZXingBrowser.BarcodeFormat && result.getBarcodeFormat() === ZXingBrowser.BarcodeFormat.UPC_E){
        // ZXing decodes UPC-E to its own compressed 8-digit form, which does
        // not validate against the standard EAN-8 checksum — expand to the
        // equivalent UPC-A form first (see expandUpcEToUpcA).
        const expanded = expandUpcEToUpcA(result.getText());
        if(!expanded || !isValidUpcEanBarcode(expanded)) return;
        stopScan(); onBarcode(expanded);
        return;
      }
      const candidate = extractGtinFromScan(result.getText());
      // Defense-in-depth: even within the restricted formats above, a
      // corrupted read can still surface a bad check digit, and a QR code
      // might not be a GS1 Digital Link at all — validate before treating
      // it as a real barcode. An invalid read is silently ignored so the
      // scan loop just keeps looking.
      if(!candidate || !isValidUpcEanBarcode(candidate)) return;
      stopScan(); onBarcode(candidate);
    });
  }catch(e){ setScanHint(t('scan.camera_error',{error:e}), true); stopScan(); }
};
function stopScan(){
  try{ reader && reader.reset && reader.reset(); }catch(e){}
  $('videoWrap').classList.add('hidden'); $('startBtn').classList.remove('hidden');
  $('stopBtn').classList.add('hidden');
}
$('stopBtn').onclick = stopScan;
$('lookupBtn').onclick = () => {
  const raw = $('manual').value.trim();
  if(!raw) return;
  const candidate = extractGtinFromManualEntry(raw);
  if(candidate && isValidUpcEanBarcode(candidate)){
    onBarcode(candidate);
    return;
  }
  // Not a valid GTIN shape — fall back to treating the raw input as a
  // manufacturer SKU/article number (e.g. a Polymaker inventory barcode
  // typed by hand instead of scanned) rather than hard-rejecting it. The
  // backend's OFD/SpoolmanDB-Community lookups decide if it resolves.
  if(isPlausibleSku(raw)){
    onBarcode(raw.toUpperCase());
    return;
  }
  setScanHint(t('scan.invalid_barcode'), true);
};
$('manual').addEventListener('input', () => { if($('scanHint').classList.contains('err')) setScanHint(''); });
$('manual').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); $('lookupBtn').click(); }});

// ── Lookup → fill form ──
async function onBarcode(barcode){
  currentBarcode = barcode;
  $('manual').value = barcode;            // echo what was read into the input
  setScanHint(t('scan.looking_up',{barcode}));
  try{
    const d = await (await fetch('/api/lookup?barcode='+encodeURIComponent(barcode))).json();
    fillForm(d);
    setScanHint('');
  }catch(e){ toast(t('scan.lookup_failed'), false); }
}

function hexToColorInput(rgba){ // RRGGBBAA → #RRGGBB
  if(!rgba) return null;
  const h = rgba.replace('#',''); return '#'+h.substring(0,6);
}
function colorInputToRgba(hex){ return hex.replace('#','').toUpperCase()+'FF'; }

// Set form fields from a parsed/looked-up object; only overwrites where the
// object actually has a value (so it merges over manual edits).
function applyFields(f){
  if(f.material!=null) setSelect('material', f.material);
  if(f.brand!=null) $('brand').value = f.brand;
  if(f.subtype!=null) setSelect('subtype', f.subtype);
  if(f.color_name!=null) $('color_name').value = f.color_name;
  if(f.rgba){ const c=hexToColorInput(f.rgba); if(c) $('color_picker').value=c; }
  if(f.label_weight!=null) setSelect('label_weight', f.label_weight);
  if(f.storage_location!=null) setSelect('storage_location', f.storage_location);
  if(f.category!=null) $('category').value = f.category;
  if(f.nozzle_temp_min!=null) $('nozzle_temp_min').value = f.nozzle_temp_min;
  if(f.nozzle_temp_max!=null) $('nozzle_temp_max').value = f.nozzle_temp_max;
  if(f.cost_per_kg!=null) $('cost_per_kg').value = f.cost_per_kg;
  if(f.note!=null) $('note').value = f.note;
}

// Built lazily (not at module scope) so it always reflects the current I18N
// dict — harmless here since the language is fixed for the page's lifetime,
// but keeps this from silently going stale if that ever changes.
function badgeFor(source){
  const BADGE = {
    cache:  [t('badge.cache'), 'cache'],
    ofd:    [t('badge.ofd'), 'cache'],
    'spoolmandb-community': [t('badge.smdb'), 'cache'],
    label:  [t('badge.label'), 'upc'],
    amazon: [t('badge.amazon'), ''],
    none:   [t('badge.none'), ''],
  };
  return BADGE[source] || BADGE.none;
}

function fillForm(d){
  const f = d.fields || {};
  $('form').classList.remove('hidden');
  const [text, cls] = badgeFor(d.source);
  $('srcBadge').className = 'badge '+cls;
  $('srcBadge').textContent = text;
  $('barcodeLine').innerHTML = d.barcode
    ? t('form.barcode_label')+' <span style="color:var(--fg);font-family:Menlo,monospace">'+d.barcode+'</span>' : '';
  $('titleLine').textContent = d.title || '';
  // Sibling GTIN/SKU codes cross-referenced from OFD/SpoolmanDB-Community
  // (see _external_all_codes in app.py) — read-only, informational only.
  const linked = d.linked_codes || [];
  $('linkedCodesLine').textContent = linked.length
    ? t('form.also_matches',{codes: linked.map(c=>c.is_refill ? c.code+t('form.refill_suffix') : c.code).join(', ')})
    : '';
  // Point the web-search link at the scanned code (helps when no DB has it).
  const code = d.barcode || currentBarcode || '';
  $('searchLink').href = 'https://www.google.com/search?q='+encodeURIComponent('"'+code+'" filament');
  $('searchLink').style.display = code ? '' : 'none';
  // 'Forget' only makes sense for a remembered (cache) entry with a barcode.
  $('forgetBtn').classList.toggle('hidden', !(code && d.source==='cache'));
  // reset then apply
  ['brand','color_name','category','nozzle_temp_min','nozzle_temp_max',
   'cost_per_kg','note','paste_title'].forEach(id=>$(id).value='');
  setSelect('material',''); setSelect('subtype',''); setSelect('storage_location','');
  setSelect('label_weight','1000'); $('quantity').value=1;
  applyFields(f);
  $('material').focus();
}

// ── OCR: read the label text from a photo (works over plain HTTP too) ──
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
function loadImage(file){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); });
}
// Draw the image rotated by `deg`, downscaled to maxDim for speed.
function rotatedCanvas(img, deg, maxDim){
  const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
  const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
  const swap = (deg===90||deg===270);
  const c=document.createElement('canvas'); c.width=swap?h:w; c.height=swap?w:h;
  const ctx=c.getContext('2d');
  ctx.translate(c.width/2, c.height/2); ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  return c;
}
// Score recognised text: more letters is better; big bonus for filament cues.
function scoreText(text){
  const letters=(text.match(/[A-Za-z]/g)||[]).length;
  const cue=/\b(PLA|PETG|PCTG|ABS|ASA|TPU|nylon|temp|filament|spool|silk|matte|dual|sunlu|esun|polymaker|panchroma|hatchbox|overture)\b/i.test(text)
    || /\d{2,3}\s*[-~]\s*\d{2,3}/.test(text);
  return letters + (cue?80:0);
}
// OCR the photo trying each orientation; keep the best (handles sideways/upside-down).
async function ocrBestOrientation(file){
  const img=await loadImage(file);
  let best={text:'', score:-1};
  for(const deg of [0,90,270,180]){
    const canvas=rotatedCanvas(img, deg, 1600);
    const { data } = await Tesseract.recognize(canvas, 'eng', { logger: m => {
      if(m.status==='recognizing text'){
        $('ocrHint').textContent = deg
          ? t('ocr.reading_label_rotated', {deg, percent:Math.round(m.progress*100)})
          : t('ocr.reading_label');
      }
    }});
    const text=(data.text||'').replace(/\s+/g,' ').trim();
    const score=scoreText(text);
    if(score>best.score) best={text,score};
    if(score>=120) break;   // strong result — no need to try more rotations
  }
  return best.text;
}

$('ocrBtn').onclick = () => $('labelPhoto').click();
$('labelPhoto').onchange = async (e) => {
  const file = e.target.files[0]; if(!file) return;
  try{
    if(!window.Tesseract){
      $('ocrHint').textContent=t('ocr.loading_recognizer');
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    $('ocrHint').textContent=t('ocr.reading_label');
    const text = await ocrBestOrientation(file);
    if(!text){ $('ocrHint').textContent=t('ocr.no_text_found'); return; }
    const d = await (await fetch('/api/parse?title='+encodeURIComponent(text))).json();
    if(d.barcode) currentBarcode = d.barcode;   // remember by the label's barcode
    const fields = Object.assign({label_weight:1000}, d.fields||{});
    // Did OCR yield anything beyond the default weight?
    const got = !!d.barcode || Object.keys(fields).some(k => k!=='label_weight');
    const dbSource = d.source==='ofd' || d.source==='spoolmandb-community';
    fillForm({ source: dbSource ? d.source : (got ? 'label' : 'none'),
               barcode: d.barcode || currentBarcode,
               title: dbSource ? (d.title||'') : '',  // never dump raw OCR text
               linked_codes: dbSource ? (d.linked_codes||[]) : [],
               fields });
    $('ocrHint').textContent = got ? '' : t('ocr.couldnt_read');
  }catch(err){ $('ocrHint').textContent=t('ocr.failed',{error:err}); }
  finally{ e.target.value=''; }
};

// Auto-fill from a pasted product title.
$('autofillBtn').onclick = async () => {
  const pastedTitle = $('paste_title').value.trim();
  if(!pastedTitle) return;
  try{
    const d = await (await fetch('/api/parse?title='+encodeURIComponent(pastedTitle))).json();
    applyFields(d.fields||{});
    if(d.barcode){
      currentBarcode = d.barcode;
      $('barcodeLine').innerHTML = t('form.barcode_label')+' <span style="color:var(--fg);font-family:Menlo,monospace">'+d.barcode+'</span>';
      const linked = d.linked_codes || [];
      $('linkedCodesLine').textContent = linked.length
        ? t('form.also_matches',{codes: linked.map(c=>c.is_refill ? c.code+t('form.refill_suffix') : c.code).join(', ')})
        : '';
    }
    if(!Object.keys(d.fields||{}).length) toast(t('form.parse_failed'), false);
  }catch(e){ toast(t('form.parse_request_failed'), false); }
};

// ── Submit ──
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const fields = {
    material: $('material').value.trim(),
    brand: $('brand').value.trim(),
    subtype: $('subtype').value.trim(),
    color_name: $('color_name').value.trim(),
    rgba: colorInputToRgba($('color_picker').value),
    label_weight: $('label_weight').value.trim(),
    storage_location: $('storage_location').value.trim(),
    category: $('category').value.trim(),
    nozzle_temp_min: $('nozzle_temp_min').value.trim(),
    nozzle_temp_max: $('nozzle_temp_max').value.trim(),
    cost_per_kg: $('cost_per_kg').value.trim(),
    note: $('note').value.trim(),
  };
  if(!fields.material){ toast(t('submit.material_required'), false); return; }
  const quantity = parseInt($('quantity').value)||1;
  $('submitBtn').disabled = true;
  try{
    const r = await fetch('/api/spool', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({barcode: currentBarcode, quantity, fields})});
    const d = await r.json();
    if(d.ok){ toast(tn('submit.added', d.created)+' ✓');
      $('form').classList.add('hidden'); $('manual').value=''; currentBarcode=null; }
    else { toast(t('submit.failed')+(d.errors&&d.errors.length?': '+d.errors[0]:''), false); }
  }catch(e){ toast(t('submit.request_failed'), false); }
  finally{ $('submitBtn').disabled = false; }
};
</script>
